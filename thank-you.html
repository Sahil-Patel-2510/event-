<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You | Event Plus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="success-page-body">
    <main class="success-shell">
      <div class="success-card">
        <div class="success-badge">✓</div>
        <p class="eyebrow success-eyebrow">Your request is confirmed</p>
        <h1>Thank you for choosing Event Plus</h1>
        <p class="success-copy" id="successMessage">Your event interest has been received successfully. Our team will contact you soon.</p>

        <div class="success-points">
          <span>✔ Personalized planning</span>
          <span>✔ Expert event coordination</span>
          <span>✔ Quick follow-up within 2–3 hours</span>
        </div>

        <div class="success-actions">
          <a href="index.html" class="btn btn-primary">Back to Home</a>
          <a href="dashboard.html" class="btn btn-secondary">Go to Dashboard</a>
        </div>
      </div>
    </main>

    <script>
      const storedMessage = localStorage.getItem('eventPlusOrderMessage');
      const successMessageNode = document.getElementById('successMessage');
      if (successMessageNode) {
        successMessageNode.textContent = storedMessage || 'Your event interest has been received successfully. Our team will contact you soon.';
      }
      localStorage.removeItem('eventPlusOrderMessage');
      document.getElementById('year')?.textContent = new Date().getFullYear();
    </script>
  </body>
</html>
